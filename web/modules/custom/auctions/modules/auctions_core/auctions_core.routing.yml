auctions_core.admin_config_auctions:
  path: '/admin/config/auctions'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Auctions'
  requirements:
    _permission: 'access administration pages'

auctions_core.auction_active_sale_heartbeat:
  path: '/auction/item/{auction_item}/heartbeat'
  defaults:
    _controller: '\Drupal\auctions_core\Controller\AuctionActiveSaleController::heartbeat'
    _title: 'Heartbeat'
  requirements:
    _permission: 'access content'
  methods: [POST]
